<!DOCTYPE html>
<html>
  <head>
    <title>Smart Study Planner</title>
    <style>
      body {
        front-family: Arial, sans-serif;
        background: #eaf4ff;
        padding: 30px;
      }
      h1 {
        color:#2563eb;
      }
      input{
        padding: 10px;
        margin: 5px
        border: 2px solid #93c5fd;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
        transform: scale(1.05);
      }
      #tasklist {
        margin-top: 20px;
        padding: 15px;
        background: white;
        border-radius: 10px;
        animation: appear 0.5s ease;
      }
      @keyframes appear {
        from{
          opacity:0;
          transform: translateY(10px);
        }
        to{
          opacity: 0;
          transform: translateY(0)
        }
      }
    </style>
  </head>
  <body>
    <h1>Smart Study Planner</h1>
  <p>Plan smarter. Study better.</p>
  <h2>Add Study Task</h2>
  <input id="subject" placeholder="subject">
  <br><br>
  <input id="task" placeholder="study task">
  <br><br>
  <button>Add Task</button>
  <h2>My Study Plan</h2>
  <p id="tasklist">No tasks added yet</p>
    <script>
      const button=
        document.querySelector("button");
        button.onclick=function() {
          const subject=
        document.getElementById("subject").value;
          const task=
          document.getElementById("task").value;
          if (subject && task) {
            document.getElementById("tasklist").textContent=
              subject + ": " + task;
     }
 };
 </script>
 </body>
</html>
